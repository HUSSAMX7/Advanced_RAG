[project]
name = "advanced-rag"
version = "0.1.0"
description = "PDF ingestion, section annotation, chunking, and FAISS indexing for RAG"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "ipykernel>=7.2.0",
    "ipython>=9.12.0",
    "langchain>=1.2.15",
    "langchain-openai>=1.1.12",
    "langgraph>=1.1.6",
    "langsmith>=0.7.25",
    "pymupdf>=1.27.2.2",
    "pypdf>=6.9.2",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.2",
    "pydantic>=2.0.0",
    "llama-index==0.14.15",
    "llama-index-llms-openai==0.6.26",
    "llama-index-embeddings-openai==0.5.2",
    "llama-index-vector-stores-faiss>=0.5.0,<0.7",
    "faiss-cpu>=1.12.0,<2",
    "llama-cloud-services==0.6.54",
    "httpx>=0.28.1",
    "pypdfium2>=4.30.0",
    "pillow>=11.0.0",
    "pydantic-settings>=2.0.0",
    "openai>=2.54.0,<3",
    "rank-bm25>=0.2.2,<0.3",
]

[dependency-groups]
dev = ["pytest>=8.0.0", "ruff>=0.11.0"]

[project.scripts]
advanced-rag = "advanced_rag.cli:main"
advanced-rag-chat = "advanced_rag.agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/advanced_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100
